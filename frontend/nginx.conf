server {
    listen 80;
    root /usr/share/nginx/html;

    # Same address for the app and the API, so the login cookie just works
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        # Overwrite (not append) so a client can't fake its IP
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React Router pages load index.html
    location / {
        try_files $uri /index.html;
    }
}
